name: Build Clint Browser ARM64

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          CLINT_KEYSTORE_B64: ${{ secrets.CLINT_KEYSTORE_B64 }}
          CLINT_KEYSTORE_PASSWORD: ${{ secrets.CLINT_KEYSTORE_PASSWORD }}
          CLINT_KEY_ALIAS: ${{ secrets.CLINT_KEY_ALIAS }}
          CLINT_KEY_PASSWORD: ${{ secrets.CLINT_KEY_PASSWORD }}
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LOCAL_PROPS: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -n "$CLINT_KEYSTORE_B64" ] && [ -n "$CLINT_KEYSTORE_PASSWORD" ]; then
            echo "Using fixed release keystore from repository secrets."
            KS="$RUNNER_TEMP/clint-release.jks"
            printf '%s' "$CLINT_KEYSTORE_B64" | tr -d '\n' | base64 -d > "$KS"
            chmod 600 "$KS"
            {
              echo "signingConfig.storeFile=$KS"
              echo "signingConfig.storePassword=$CLINT_KEYSTORE_PASSWORD"
              echo "signingConfig.keyAlias=${CLINT_KEY_ALIAS:-clint}"
              echo "signingConfig.keyPassword=${CLINT_KEY_PASSWORD:-$CLINT_KEYSTORE_PASSWORD}"
            } > local.properties
            chmod 600 local.properties
          elif [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | tr -d '\n' | base64 -d > app/release_keystore.jks
            printf '%s\n' "$LOCAL_PROPS" > local.properties
          else
            echo "No signing secrets (fork/PR): generating throwaway fallback keystore..."
            keytool -genkeypair -v -keystore app/release_keystore.jks -alias clint -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Clint, OU=Clint, O=Clint, L=Clint, S=Clint, C=US"
            echo "signingConfig.storeFile=app/release_keystore.jks" > local.properties
            echo "signingConfig.storePassword=123456" >> local.properties
            echo "signingConfig.keyAlias=clint" >> local.properties
            echo "signingConfig.keyPassword=123456" >> local.properties
          fi

      - name: Build GitHub Release APKs
        run: ./gradlew assembleGithubRelease

      - name: List generated APKs
        run: find app/build/outputs/apk/github/release -name "*.apk" | sort

      - name: Print APK signing certificate
        run: |
          APK=app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$SIGNER" verify --print-certs "$APK" | grep -E 'SHA-256|DN'

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-arm64-v8a
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 3
